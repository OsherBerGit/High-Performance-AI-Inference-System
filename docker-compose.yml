services:
  postgres:
    image: postgres:15-alpine
    container_name: hybrid_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: HybridPipelineDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  engine:
    build:
      context: ./engine
    container_name: hybrid_engine
    ports:
      - "50051:50051"

  gateway:
    build:
      context: ./gateway
    container_name: hybrid_gateway
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=HybridPipelineDb;Username=${DB_USER};Password=${DB_PASSWORD}
      - EngineServiceUrl=http://engine:50051
      - ASPNETCORE_HTTP_PORTS=8080 # ASP.NET 8 default container port
    ports:
      - "5110:8080" # Map local 5110 to container 8080
    depends_on:
      - engine
      - postgres

  dashboard:
    build:
      context: ./dashboard
    container_name: hybrid_dashboard
    ports:
      - "3000:80" # The React app will be accessible at http://localhost:3000
    depends_on:
      - gateway

volumes:
  pgdata: